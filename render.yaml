services:
  - type: web
    name: danisua-api
    runtime: node
    plan: 0.5c-512mb
    branch: master
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health

    disk:
      name: danisua-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: DANISUA_DB_PATH
        value: /var/data/danisua.sqlite

      - key: CORS_ORIGINS
        value: https://danisua.netlify.app

      - key: NODE_VERSION
        value: 24.21.0

      # Awin sync resta opt-in.
      # Credenziali e advertiser allowlist NON vanno nel repository.
      - key: AWIN_SYNC_ENABLED
        value: "false"

      - key: AWIN_SYNC_INTERVAL_MINUTES
        value: "60"

      - key: AWIN_SYNC_JITTER_MAX_SECONDS
        value: "120"

      - key: AWIN_PRIMARY_REGION
        value: IT

      - key: AWIN_ALLOW_SOFT_MEMBERSHIP
        value: "false"