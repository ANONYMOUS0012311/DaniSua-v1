name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend syntax
        run: |
          node --check app.js
          node --check normalize.js
          node --check scripts/live-production-smoke.js
          node --check server/utils/productImage.js
          node --check server/tests/productImageSmoke.js

      - name: Run smoke tests
        run: npm test

      - name: Run product image resolver tests
        run: npm run test:product-image

      - name: Run ingestion core tests
        run: npm run test:ingestion-core

      - name: Run production config tests
        run: npm run test:production-config

      - name: Run database reliability tests
        run: npm run test:database

      - name: Run persistent import tests
        run: npm run test:persistent-import

      - name: Run Awin integration tests
        run: npm run test:awin

      - name: Run Awin feed-state tests
        run: npm run test:awin-state

      - name: Run Awin end-to-end sync tests
        run: npm run test:awin-sync

      - name: Run Awin runtime scheduler tests
        run: npm run test:awin-scheduler

      - name: Run Awin preflight tests
        run: npm run test:awin-preflight

      - name: Run reliability queue tests
        run: npm run test:reliability

      - name: Run beta readiness tests
        run: npm run test:beta-readiness

      - name: Run offer outcome tests
        run: npm run test:offer-outcome

      - name: Run production reliability end-to-end test
        run: npm run test:production-reliability

      - name: Run closed beta journey regression test
        run: npm run test:closed-beta-journey

      - name: Run closed beta concurrency smoke test
        run: npm run test:closed-beta-load

      - name: Check offer freshness
        run: npm run check:freshness

      - name: Report beta readiness
        run: npm run beta:readiness

      - name: Check smartphone catalog coverage
        run: npm run catalog:coverage

      - name: Check product knowledge coverage
        run: npm run knowledge:coverage

      - name: Audit production dependencies
        run: npm audit --audit-level=moderate
