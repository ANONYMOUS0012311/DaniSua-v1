name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend syntax
        run: |
          node --check app.js
          node --check normalize.js

      - name: Run smoke tests
        run: npm test

      - name: Run database reliability tests
        run: npm run test:database

      - name: Run persistent import tests
        run: npm run test:persistent-import

      - name: Run Awin integration tests
        run: npm run test:awin

      - name: Run Awin feed-state tests
        run: npm run test:awin-state

      - name: Run Awin end-to-end sync tests
        run: npm run test:awin-sync

      - name: Run Awin runtime scheduler tests
        run: npm run test:awin-scheduler

      - name: Run reliability queue tests
        run: npm run test:reliability

      - name: Check offer freshness
        run: npm run check:freshness

      - name: Check smartphone catalog coverage
        run: npm run catalog:coverage

      - name: Check product knowledge coverage
        run: npm run knowledge:coverage

      - name: Audit production dependencies
        run: npm audit --audit-level=moderate
