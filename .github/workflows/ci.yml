name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm test

      - name: Check offer freshness
        run: npm run check:freshness

      - name: Check smartphone catalog coverage
        run: npm run catalog:coverage

      - name: Check product knowledge coverage
        run: npm run knowledge:coverage

      - name: Audit production dependencies
        run: npm audit --audit-level=moderate
