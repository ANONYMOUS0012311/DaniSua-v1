name: One-time production load test

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  production-load:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Wait for observability deployment
        shell: bash
        run: |
          ok=0
          for i in {1..24}; do
            headers="$(curl -fsS -D - -o /dev/null --max-time 15 https://danisuai.onrender.com/health || true)"
            if echo "$headers" | grep -qi '^x-request-id:'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Load test 10 to 100 concurrent requests
        run: >
          node scripts/load-test.js
          --url "https://danisuai.onrender.com/search?q=AirPods"
          --levels "10,25,50,100"
          --requests-per-level "100"
          --max-p95-ms "5000"
          --max-error-rate "0.01"
          --timeout-ms "15000"

      - name: Remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/production-load-once.yml
          git add scripts/load-test.js
          git commit -m "Add reusable production load tester"
          git push origin HEAD:${{ github.head_ref }}
