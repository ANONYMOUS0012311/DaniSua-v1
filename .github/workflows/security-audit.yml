name: Security Audit

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Current audit
        run: npm audit --json || true

      - name: Proposed audit fix dry run
        run: npm audit fix --dry-run --json || true
