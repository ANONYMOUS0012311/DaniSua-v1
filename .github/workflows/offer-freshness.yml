name: Offer freshness

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report 2h / 6h offer reliability
        run: npm run check:freshness -- --fresh-hours 2 --review-hours 6

      - name: Enforce first-5-user beta data gate
        run: npm run beta:closed-check
