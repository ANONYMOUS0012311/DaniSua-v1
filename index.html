<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>DaniSua IA – Trova dove conviene comprare</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ========================================
       HEADER
  ========================================= -->

  <header class="header">

    <div class="header-inner">

      <div class="logo-box">
        <span class="logo-d">D</span>
      </div>

      <div class="brand">
        DaniSua
        <span class="brand-ia">IA</span>
      </div>

    </div>

  </header>


  <!-- ========================================
       MAIN
  ========================================= -->

  <main class="main">

    <section class="hero">

      <!-- TITOLO -->

      <h1>
        Trova il prodotto giusto, al prezzo che conviene.
      </h1>

      <p class="subtitle">
        Scrivi come parleresti: un modello preciso, il tuo budget oppure semplicemente cosa ti serve.
      </p>


      <!-- ========================================
           RICERCA
      ========================================= -->

      <div class="search-area">

        <input
          id="buscador-input"
          type="text"
          placeholder="Es. voglio un telefono con ottima fotocamera sotto 700 €"
          autocomplete="off"
        />

        <button id="buscador-btn">
          Cerca
        </button>

      </div>

      <div
        id="search-examples"
        class="search-examples"
        aria-label="Esempi di ricerca"
      >
        <span class="search-examples-label">
          Prova:
        </span>

        <button
          type="button"
          class="search-example"
          data-query="iPhone 17 più economico"
        >
          iPhone 17 più economico
        </button>

        <button
          type="button"
          class="search-example"
          data-query="smartphone per foto sotto 800 euro"
        >
          smartphone per foto sotto 800 €
        </button>

        <button
          type="button"
          class="search-example"
          data-query="Galaxy S26 Ultra 512 GB"
        >
          Galaxy S26 Ultra 512 GB
        </button>
      </div>


      <!-- ========================================
           INTERPRETAZIONE IA
      ========================================= -->

      <p
        id="ai-hint"
        class="ai-hint"
      ></p>


      <!-- ========================================
           DANISUA IA — MIGLIORE OFFERTA
      ========================================= -->

      <div
        id="ai-best-offer"
        class="ai-best-offer"
        style="display: none;"
      >

        <div class="ai-best-header">

          <span class="ai-best-eyebrow">
            DaniSua
          </span>

          <span class="ai-best-title">
            Per te conviene
          </span>

        </div>

        <div
          id="ai-best-content"
          class="ai-best-content"
        ></div>

      </div>


      <!-- ========================================
           RISULTATI
      ========================================= -->

      <div class="results-head">

        <span class="results-label">
          Offerte confrontate
        </span>

        <div
          id="resultados-contador"
          class="results-count"
        >
          0 risultati
        </div>

      </div>


      <!-- ========================================
           PRODOTTI
      ========================================= -->

      <div
        id="productos-container"
        class="products-grid"
        aria-live="polite"
      ></div>

    </section>

  </main>


  <!-- ========================================
       FOOTER
  ========================================= -->

  <footer class="footer">

    <small>
      Versione 1 · Prototipo ·
      Alcuni link potrebbero essere affiliati
    </small>

  </footer>


  <!-- ========================================
       JAVASCRIPT

       IMPORTANTE:
       normalize.js deve essere caricato
       prima di app.js
  ========================================= -->

  <script src="normalize.js"></script>
  <script src="app.js"></script>

</body>

</html>
